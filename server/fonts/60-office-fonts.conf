<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Microsoft's fonts can't be put on the server, so Word files get free ones that take up the same width and keep their
     line breaks: Gelasio and Selawik match Georgia and Segoe UI letter for letter, Wine's Tahoma (fonts-wine) matches
     Tahoma, DejaVu Sans is within 1% of Verdana, and Liberation Sans is the nearest of those measured for Aptos. -->
<fontconfig>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Selawik Semibold</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Selawik Light</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semilight</family><prefer><family>Selawik Semilight</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Wine Tahoma</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
</fontconfig>
